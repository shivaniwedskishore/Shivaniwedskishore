<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shivani Weds Kishore | 25th June 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>

    :root {
      --saffron:        #d4720a;
      --saffron-light:  #f0a030;
      --marigold:       #e8b830;
      --marigold-light: #f8d878;
      --marigold-pale:  #fef3c7;
      --temple-red:     #7a1515;
      --temple-dark:    #2e0d0d;
      --temple-brown:   #4a2008;
      --temple-mid:     #6b3010;
      --cream:          #fdf6e8;
      --parchment:      #f7e8cc;
      --parchment-dark: #edd9a3;
      --mango-green:    #3d6b32;
      --mango-mid:      #4e8a40;
      --mango-light:    #6aad58;
      --text-dark:      #1e0e06;
      --text-mid:       #5a3018;
      --text-light:     #8a5530;
      --white:          #ffffff;
      --kumkum:         #b02020;
      --gold-shine:     #c8960c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background-color: var(--cream);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; }
    a { text-decoration: none; color: inherit; }

    /* ── UTILITY ── */
    .marigold-border {
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg,
        var(--temple-dark),
        var(--temple-red) 15%,
        var(--marigold) 35%,
        var(--saffron-light) 50%,
        var(--marigold) 65%,
        var(--temple-red) 85%,
        var(--temple-dark)
      );
    }

    .section-inner { max-width: 1080px; margin: 0 auto; }

    .section-title { text-align: center; margin-bottom: 3.5rem; }

    .section-title h2 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      color: var(--temple-dark);
      letter-spacing: 0.04em;
    }

    .temple-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 0.9rem 0 0.7rem;
    }

    .temple-divider .line {
      flex: 1;
      max-width: 140px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--marigold), transparent);
    }

    .temple-divider .ornament {
      color: var(--saffron);
      font-size: 1rem;
      letter-spacing: 0.3em;
    }

    .section-title p {
      color: var(--text-light);
      font-size: 1rem;
      font-family: 'EB Garamond', serif;
      font-style: italic;
      letter-spacing: 0.03em;
    }

    /* ── NAVIGATION ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(22, 6, 6, 0.97);
      border-bottom: 2px solid var(--marigold);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 1.5rem;
      height: 54px;
      flex-wrap: wrap;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: rgba(248, 216, 120, 0.85);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.3rem 0.7rem;
      position: relative;
      transition: color 0.3s;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%; right: 50%;
      height: 1px;
      background: var(--marigold);
      transition: left 0.3s, right 0.3s;
    }

    nav a:hover { color: var(--white); }
    nav a:hover::after { left: 0.7rem; right: 0.7rem; }

    .nav-sep {
      color: rgba(232, 184, 48, 0.3);
      font-size: 0.6rem;
      padding: 0 0.1rem;
    }

    /* ── TORANA WRAP ── */
    .torana-wrap {
      position: absolute;
      top: 54px;
      left: 0; right: 0;
      z-index: 8;
      pointer-events: none;
      width: 100%;
      overflow: hidden;
    }

    .torana-wrap svg {
      display: block;
      width: 100%;
    }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10rem 2rem 5rem;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,184,48,0.14) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 15% 90%,  rgba(122,21,21,0.3)   0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 90%,  rgba(122,21,21,0.3)   0%, transparent 60%),
        linear-gradient(175deg, #160404 0%, #2e0d0d 30%, #4a1a06 65%, #6b2c0a 100%);
    }

    .hero-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(232,184,48,0.1);
      pointer-events: none;
    }

    .hero-ring-1 { width: 500px; height: 500px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .hero-ring-2 { width: 700px; height: 700px; top: 50%; left: 50%; transform: translate(-50%,-50%); border-color: rgba(232,184,48,0.06); }
    .hero-ring-3 { width: 900px; height: 900px; top: 50%; left: 50%; transform: translate(-50%,-50%); border-color: rgba(232,184,48,0.04); }

    .petal {
      position: absolute;
      animation: floatPetal linear infinite;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      font-size: 1rem;
    }

    @keyframes floatPetal {
      0%   { transform: translateY(-20px) rotate(0deg) scale(0.8);   opacity: 0; }
      8%   { opacity: 0.7; }
      92%  { opacity: 0.4; }
      100% { transform: translateY(105vh) rotate(400deg) scale(1.1); opacity: 0; }
    }

    .hero-om {
      font-size: 2.6rem;
      color: var(--marigold);
      position: relative;
      z-index: 2;
      margin-bottom: 1.2rem;
      animation: glowPulse 4s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(232,184,48,0.5));
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(232,184,48,0.4)); }
      50%       { filter: drop-shadow(0 0 28px rgba(232,184,48,0.8)); }
    }

    .hero-names-block {
      position: relative;
      z-index: 2;
      display: inline-block;
    }

    .corner-ornament {
      position: absolute;
      width: 40px; height: 40px;
      border-color: rgba(232,184,48,0.5);
      border-style: solid;
    }

    .corner-ornament.tl { top: -8px; left: -8px; border-width: 2px 0 0 2px; }
    .corner-ornament.tr { top: -8px; right: -8px; border-width: 2px 2px 0 0; }
    .corner-ornament.bl { bottom: -8px; left: -8px; border-width: 0 0 2px 2px; }
    .corner-ornament.br { bottom: -8px; right: -8px; border-width: 0 2px 2px 0; }

    .hero-names-inner { padding: 2rem 3.5rem; }

    .hero-bride-name,
    .hero-groom-name {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(3.5rem, 10vw, 7rem);
      color: var(--marigold-light);
      line-height: 1;
      letter-spacing: 0.02em;
      text-shadow:
        0 2px 8px rgba(0,0,0,0.6),
        0 0 40px rgba(232,184,48,0.2);
    }

    .hero-weds {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      color: var(--saffron-light);
      letter-spacing: 0.25em;
      margin: 0.4rem 0;
      opacity: 0.9;
    }

    .hero-date-line {
      position: relative;
      z-index: 2;
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .hero-date-line .date-rule {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,184,48,0.6));
    }

    .hero-date-line .date-rule.right {
      background: linear-gradient(90deg, rgba(232,184,48,0.6), transparent);
    }

    .hero-date-text {
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
      color: rgba(248,216,120,0.8);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: rgba(255,255,255,0.25);
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      animation: bounceHint 3s ease-in-out infinite;
    }

    .scroll-hint svg {
      width: 16px; height: 16px;
      stroke: rgba(232,184,48,0.3);
      fill: none;
      stroke-width: 1.5;
    }

    @keyframes bounceHint {
      0%, 100% { transform: translateX(-50%) translateY(0);   opacity: 0.6; }
      50%       { transform: translateX(-50%) translateY(10px); opacity: 1; }
    }

    /* ── EVENTS ── */
    #events {
      padding: 5rem 1.5rem;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(232,184,48,0.05) 0%, transparent 60%),
        var(--parchment);
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.6rem;
      max-width: 760px;
      margin: 0 auto;
    }

    .event-card {
      background: var(--white);
      border-radius: 2px;
      overflow: hidden;
      box-shadow:
        0 2px 8px rgba(44,16,4,0.08),
        0 8px 32px rgba(44,16,4,0.06);
      border: 1px solid rgba(212,114,10,0.15);
      transition: transform 0.35s cubic-bezier(0.25,0.8,0.25,1), box-shadow 0.35s;
      position: relative;
    }

    .event-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--temple-red), var(--marigold), var(--temple-red));
    }

    .event-card:hover {
      transform: translateY(-8px);
      box-shadow:
        0 4px 16px rgba(44,16,4,0.12),
        0 20px 48px rgba(44,16,4,0.12);
    }

    .event-card-header {
      background: linear-gradient(150deg, var(--temple-dark) 0%, var(--temple-brown) 100%);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .event-card-header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 20px;
      background: var(--white);
      clip-path: ellipse(55% 100% at 50% 100%);
    }

    .event-icon { font-size: 2rem; display: block; margin-bottom: 0.7rem; position: relative; z-index: 1; }

    .event-card-header h3 {
      color: var(--marigold-light);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      position: relative; z-index: 1;
    }

    .event-card-header .event-date {
      color: rgba(255,255,255,0.55);
      font-size: 0.75rem;
      margin-top: 0.4rem;
      letter-spacing: 0.12em;
      font-family: 'Lato', sans-serif;
      position: relative; z-index: 1;
    }

    .event-card-body { padding: 1.6rem 1.4rem 1.4rem; }

    .event-card-body p {
      font-size: 0.88rem;
      color: var(--text-mid);
      line-height: 1.75;
      margin-bottom: 1.2rem;
    }

    .event-card-body p strong {
      color: var(--temple-dark);
      font-size: 0.95rem;
      display: block;
      margin-bottom: 0.2rem;
    }

    .map-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--saffron);
      border: 1.5px solid var(--saffron);
      padding: 0.5rem 1.1rem;
      border-radius: 2px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.25s;
    }

    .map-btn:hover {
      background: var(--saffron);
      color: var(--white);
      box-shadow: 0 4px 16px rgba(212,114,10,0.3);
    }

    /* ── ITINERARY ── */
    #itinerary {
      padding: 5rem 1.5rem;
      background: var(--cream);
    }

    .itinerary-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 3rem;
    }

    .tab-btn {
      background: var(--white);
      border: 1.5px solid rgba(212,114,10,0.25);
      color: var(--text-light);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.4rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.04em;
    }

    .tab-btn:hover { border-color: var(--saffron); color: var(--saffron); }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--temple-dark), var(--temple-brown));
      border-color: transparent;
      color: var(--marigold-light);
      box-shadow: 0 4px 20px rgba(44,16,4,0.2);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.35s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .itinerary-day-label { text-align: center; margin-bottom: 2.5rem; }

    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: linear-gradient(135deg, var(--temple-dark), var(--temple-mid));
      color: var(--marigold-light);
      padding: 0.6rem 2rem;
      border-radius: 2px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      border: 1px solid rgba(232,184,48,0.2);
      box-shadow: 0 4px 16px rgba(44,16,4,0.15);
    }

    .timeline {
      position: relative;
      max-width: 740px;
      margin: 0 auto;
      padding-left: 2.5rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 8px; bottom: 8px;
      width: 2px;
      background: linear-gradient(180deg,
        var(--marigold) 0%,
        var(--saffron) 30%,
        var(--temple-red) 70%,
        var(--marigold) 100%
      );
      border-radius: 2px;
    }

    .timeline-item {
      position: relative;
      display: flex;
      gap: 1.4rem;
      margin-bottom: 1.2rem;
      align-items: flex-start;
    }

    .timeline-dot {
      position: absolute;
      left: -2.1rem;
      top: 0.9rem;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--parchment);
      border: 2px solid var(--marigold);
      box-shadow: 0 0 0 3px rgba(232,184,48,0.15);
      z-index: 1;
    }

    .timeline-dot.muhurtham {
      background: var(--kumkum);
      border-color: var(--kumkum);
      width: 18px; height: 18px;
      left: -2.25rem; top: 0.75rem;
      box-shadow: 0 0 0 4px rgba(176,32,32,0.15), 0 0 16px rgba(176,32,32,0.4);
      animation: muhurthamPulse 2.5s ease-in-out infinite;
    }

    @keyframes muhurthamPulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(176,32,32,0.15), 0 0 16px rgba(176,32,32,0.35); }
      50%       { box-shadow: 0 0 0 7px rgba(176,32,32,0.1),  0 0 28px rgba(176,32,32,0.55); }
    }

    .timeline-time {
      flex-shrink: 0;
      min-width: 80px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--saffron);
      letter-spacing: 0.08em;
      padding-top: 0.75rem;
      text-align: right;
      font-family: 'Lato', sans-serif;
    }

    .timeline-content {
      flex: 1;
      background: var(--white);
      border: 1px solid rgba(212,114,10,0.12);
      border-left: 2px solid var(--marigold);
      border-radius: 2px;
      padding: 0.75rem 1.1rem;
      box-shadow: 0 1px 6px rgba(44,16,4,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .timeline-content:hover {
      transform: translateX(4px);
      box-shadow: 0 4px 16px rgba(44,16,4,0.1);
    }

    .timeline-content.muhurtham {
      background: linear-gradient(135deg, #fff9ee, #fff4dc);
      border-left-color: var(--kumkum);
      border-color: rgba(176,32,32,0.18);
    }

    .timeline-content h4 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--temple-dark);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .timeline-content.muhurtham h4 { color: var(--kumkum); }

    .timeline-content p {
      font-size: 0.82rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-top: 0.25rem;
      font-family: 'EB Garamond', serif;
      font-style: italic;
    }

    .muhurtham-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--kumkum);
      color: var(--white);
      font-size: 0.58rem;
      font-weight: 700;
      font-family: 'Lato', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.18rem 0.55rem;
      border-radius: 10px;
    }

    .t-icon { font-size: 0.95rem; flex-shrink: 0; }

    /* ── LIVE STREAM ── */
    #livestream {
      padding: 5rem 1.5rem;
      background: var(--parchment);
      position: relative;
    }

    .stream-wrapper { max-width: 860px; margin: 0 auto; text-align: center; }

    .stream-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--kumkum);
      color: var(--white);
      padding: 0.4rem 1.2rem;
      border-radius: 2px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      animation: pulseBadge 2.5s infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.7; }
    }

    .stream-dot { width: 7px; height: 7px; background: var(--white); border-radius: 50%; }

    .video-frame-outer {
      padding: 3px;
      background: linear-gradient(135deg, var(--marigold), var(--saffron), var(--temple-red), var(--saffron), var(--marigold));
      border-radius: 4px;
      box-shadow: 0 12px 48px rgba(44,16,4,0.25);
    }

    .video-frame-inner {
      background: var(--temple-dark);
      border-radius: 2px;
      padding: 0.6rem;
    }

    .video-frame-inner::before {
      content: '✦  🌼  ✦  🌼  ✦  🌼  ✦  🌼  ✦  🌼  ✦';
      display: block;
      text-align: center;
      font-size: 0.75rem;
      color: var(--marigold);
      letter-spacing: 0.3em;
      padding: 0.35rem 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .video-frame-inner::after {
      content: '✦  🌼  ✦  🌼  ✦  🌼  ✦  🌼  ✦  🌼  ✦';
      display: block;
      text-align: center;
      font-size: 0.75rem;
      color: var(--marigold);
      letter-spacing: 0.3em;
      padding: 0.35rem 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 1px;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .stream-note {
      margin-top: 1.4rem;
      font-size: 0.85rem;
      co
